<style>
:root{--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#7b3fe4;--btn2:#8a6cf0;--ok:#2fbf71;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1a1040;color:var(--ink);overscroll-behavior:none;
  font-family:"Segoe UI","Trebuchet MS",system-ui,-apple-system,Roboto,Arial,sans-serif}
canvas{display:block;position:fixed;inset:0;touch-action:none}
h1{margin:4px 0;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:.06em;text-transform:uppercase;font-weight:900;line-height:1.1}
p{margin:4px 0}.meta{font-size:.85rem;opacity:.8}.big{font-size:1.3rem;font-weight:800}
.gem{display:inline-block;width:.75em;height:.75em;background:linear-gradient(135deg,#b6f6ff,#2bb8ff);transform:rotate(45deg);border-radius:2px;margin:0 .45em 0 .2em}
button{font:inherit;font-weight:800;color:#fff;border:0;border-radius:999px;background:var(--btn);padding:12px 30px;cursor:pointer;
  box-shadow:0 4px 14px rgba(150,80,200,.4);text-transform:uppercase;letter-spacing:.04em}
button:active{transform:scale(.96)}button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.sec{background:transparent;border:2px solid var(--btn2);box-shadow:none}
/* ---- garage / results overlay ---- */
#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5;
  background:linear-gradient(transparent 30%,rgba(26,16,64,.7))}
#box{background:var(--card);border-radius:28px;padding:16px 18px 14px;width:100%;max-width:880px;max-height:94vh;max-height:94dvh;overflow:auto;
  text-align:center;box-shadow:0 10px 40px rgba(120,60,180,.45);backdrop-filter:blur(6px)}
.gp{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 16px;font-weight:800;margin:6px 0}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin:8px 0}
.card{position:relative;text-align:left;text-transform:none;letter-spacing:0;font-weight:600;padding:10px 10px 8px;border-radius:18px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);box-shadow:none}
.card.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.card b{display:block;font-size:.95rem;line-height:1.1;max-width:78%;font-weight:800}.card small{opacity:.75;font-size:.75rem}
.sw{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:3px solid #fff}
.bar{display:flex;align-items:center;gap:5px;font-size:.68rem;margin-top:4px;opacity:.9}.bar span{width:52px}
.bar div{flex:1;height:5px;background:rgba(255,255,255,.18);border-radius:3px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.pr{display:block;margin-top:6px;font-style:normal;font-weight:800;font-size:.85rem;color:var(--gold)}
.ups{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
.ups button{padding:8px 14px;font-size:.8rem;background:rgba(255,255,255,.12);box-shadow:none}
.ups small{opacity:.8;font-weight:600;margin:0 4px}
#go,.go{background:var(--ok);color:#06240f;font-size:1.25rem;padding:14px 44px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stat{display:flex;justify-content:space-around;margin:10px 0}.stat div{font-size:.78rem;opacity:.9}.stat b{display:block;font-size:1.4rem}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:4;padding:max(12px,env(safe-area-inset-top)) 14px 14px}
.pill{display:inline-block;background:rgba(44,26,78,.82);border-radius:999px;padding:6px 16px;font-weight:800;backdrop-filter:blur(4px)}
#hud .tl{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px}
#hud .tr{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;text-align:right}
#hud .tc{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center}
#hud .bc{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;min-width:240px}
#kmh{font-size:clamp(54px,10vw,92px);font-weight:900;line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.bc small{color:var(--gold);font-weight:800;margin-left:6px}
#nb{height:12px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px;border:2px solid rgba(255,255,255,.35)}
#nb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b3b,#ffe14d,#3ddc84,#3da5ff,#9b5cff)}
.lbl{font-size:.7rem;opacity:.8;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.boss{background:#c0152a;color:#fff;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:900;margin-left:6px}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;pointer-events:none;font-size:clamp(70px,22vw,200px);
  font-weight:900;text-shadow:0 6px 30px rgba(0,0,0,.6);color:#fff}
#help{position:fixed;bottom:14px;right:16px;font-size:.75rem;opacity:.7;z-index:4;display:none;text-align:right}
/* ---- touch pad ---- */
#pad{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 14px 14px;z-index:7;pointer-events:none}
#pad div{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#pad b{width:68px;height:68px;border-radius:50%;background:rgba(44,26,78,.7);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;
  font-size:26px;user-select:none;touch-action:none}#pad b.on{background:var(--btn)}
@media (max-width:640px){#hud .bc{bottom:92px}#help{display:none!important}}

/* ---- mobile ---- */
html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#box{max-height:92dvh}
#fs{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:8;padding:8px 14px;font-size:1.2rem;background:rgba(44,26,78,.8);border:2px solid #00f0ff}
#rot{display:none;font-size:.85rem;color:#ffe14d;margin:6px 0 0}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
/* ---- THE FOURTH: calm, soft theme ---- */
:root{--sage:#9fd3b4;--sand:#f3e19a;--night:#2b3350}
body,button{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#ov{background:linear-gradient(transparent 50%,rgba(30,36,60,.5));justify-content:center}
#box{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;background:rgba(36,44,72,.84);border:0;border-radius:28px;
  padding:12px;max-width:680px;width:100%;backdrop-filter:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
@media (max-width:560px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
.car{padding:6px;line-height:0;font-size:40px;border-radius:20px;background:rgba(255,255,255,.1);border:3px solid transparent;box-shadow:none;transition:transform .12s}
.car img{width:100%;height:auto;display:block;pointer-events:none}
.car.on{border-color:var(--sand);background:rgba(255,255,255,.22);transform:scale(1.05)}
.play{width:96px;height:96px;border-radius:50%;padding:0;font-size:46px;line-height:1;background:var(--sage);color:#1f3a2c;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.play.alt{background:#9cc6ea;color:#1c3550}
.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;width:54px;height:54px;border-radius:50%;background:var(--sand);color:var(--night);
  display:grid;place-items:center;font:900 32px/1 "Trebuchet MS",sans-serif}
.pill{background:rgba(36,44,72,.72);border:0;box-shadow:none;font-size:1.5rem;padding:6px 16px;font-weight:700}
#nb{display:flex;align-items:center;gap:10px;background:rgba(36,44,72,.72);padding:6px 16px;border-radius:999px;font-size:1.4rem}
#nb span{display:block;width:min(36vw,240px);height:14px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
#nb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2a0a0,#f3e19a,#a6d9b0,#9cc6ea,#bba8e6)}
#msg{font-size:clamp(50px,16vw,130px);-webkit-text-stroke:0;text-shadow:0 4px 18px rgba(0,0,0,.35)}
#fs{background:rgba(36,44,72,.72);border:0;box-shadow:none;top:auto;bottom:12px;right:12px;opacity:.7}
#joy{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:3px solid rgba(255,255,255,.4);display:none;pointer-events:none;z-index:7}
#joy i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:rgba(255,255,255,.55)}
#hint{position:fixed;left:50%;bottom:18%;margin-left:-32px;font-size:64px;display:none;pointer-events:none;z-index:7;animation:sway 1.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
.res{width:100%;text-align:center}.res .medal{font-size:clamp(70px,20vw,120px);line-height:1}.res .st{font-size:44px;letter-spacing:6px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;opacity:.85;animation:fall 3.4s linear infinite}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#hint,.conf i{animation:none}}
</style>

<body>
<div id="ov"><div id="box"></div></div>
<div id="hud">
  <div class="tl"><span class="pill" id="hPos">🥇</span> <span class="pill" id="hLap"></span></div>
  <div class="tc"><div id="nb"><b>⚡</b><span><i id="nbf"></i></span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE, $ = id => document.getElementById(id);
/* =====================================================================
   CAR BUILDERS
   Side profiles are [z,y] points (z+ = front) extruded across the width.
   ===================================================================== */
function extrude(profile, width, mat) {
  const s = new T.Shape();
  profile.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
  const g = new T.ExtrudeGeometry(s, {depth: width - .16, bevelEnabled: true, bevelSize: .08, bevelThickness: .08, bevelSegments: 2});
  g.translate(0, 0, -(width - .16) / 2);
  const m = new T.Mesh(g, mat);
  m.rotation.y = -Math.PI / 2;           // local x -> world z (car forward)
  return m;
}
const stdMat = (c, r = .35, m = .5) => new T.MeshStandardMaterial({color: c, roughness: r, metalness: m});
const glass = new T.MeshStandardMaterial({color: 0x1a2630, roughness: .1, metalness: .8});
const black = stdMat(0x111111, .6, .2), chrome = stdMat(0xdddddd, .15, 1);
const lightF = new T.MeshBasicMaterial({color: 0xfff3c0}), lightR = new T.MeshBasicMaterial({color: 0xff2020});

function box(g, w, h, l, mat, x, y, z) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, l), mat); m.position.set(x, y, z); g.add(m); return m;
}
/* Wheel = pivot (steer) > spin (roll) > cylinder. Returns pivots for animation. */
function addWheels(g, fz, rz, tx, r, w, rimColor) {
  const wheels = [];
  [[tx, fz, 1], [-tx, fz, 1], [tx, rz, 0], [-tx, rz, 0]].forEach(([x, z, front]) => {
    const pivot = new T.Group(), spin = new T.Group();
    const tire = new T.Mesh(new T.CylinderGeometry(r, r, w, 20), stdMat(0x181818, .9, 0));
    tire.rotation.z = Math.PI / 2;
    const rim = new T.Mesh(new T.CylinderGeometry(r * .62, r * .62, w + .02, 10), stdMat(rimColor, .3, .9));
    rim.rotation.z = Math.PI / 2;
    const spoke = new T.Mesh(new T.BoxGeometry(w + .04, r * .2, r * 1.2), black);   // makes rotation visible
    spin.add(tire, rim, spoke); pivot.add(spin); pivot.position.set(x, r, z); g.add(pivot);
    wheels.push({pivot, spin, front});
  });
  g.userData.wheels = wheels;
}
function lights(g, front, rear, w, yF, yR) {
  [-1, 1].forEach(s => {
    const a = new T.Mesh(new T.SphereGeometry(.13, 8, 8), lightF); a.position.set(s * w, yF, front); g.add(a);
    box(g, .3, .08, .05, lightR, s * w, yR, rear);
  });
}

const CARS = [
 { name: 'Mercedes-Benz 300SL', year: 1954, color: 0xc9ced4, max: 70, acc: 24, hnd: 1.75,
   build() {
     const g = new T.Group(), m = stdMat(0xc9ced4, .25, .9);
     g.add(extrude([[-2.1,.35],[-2.2,.75],[-1.4,.92],[.2,1],[1.5,.88],[2.2,.7],[2.2,.35]], 1.85, m));
     g.add(extrude([[-1.0,.95],[-.6,1.4],[.35,1.4],[.8,.98]], 1.5, glass));
     // gullwing doors raised slightly on the roofline
     [-1, 1].forEach(s => { const d = box(g, .05, .5, 1.1, m, s * .78, 1.12, -.1); d.rotation.z = -s * .35; });
     box(g, .7, .22, .06, chrome, 0, .62, 2.25);                 // grille
     addWheels(g, 1.35, -1.35, .9, .37, .26, 0xcccccc); lights(g, 2.15, -2.2, .6, .78, .75); return g;
   }},
 { name: 'Ferrari F1 (Classic)', year: 1976, color: 0xd40000, max: 92, acc: 34, hnd: 2.1,
   build() {
     const g = new T.Group(), m = stdMat(0xd40000, .3, .4);
     box(g, .75, .5, 3.2, m, 0, .55, -.1);                               // tub
     const nose = new T.Mesh(new T.CylinderGeometry(.12, .36, 1.6, 12), m);
     nose.rotation.x = Math.PI / 2; nose.position.set(0, .5, 2.2); g.add(nose);
     box(g, 2.0, .06, .5, m, 0, .25, 2.9);                               // front wing
     [-1, 1].forEach(s => { box(g, .06, .3, .5, black, s * 1.0, .38, 2.9); box(g, .5, .45, 1.5, m, s * .62, .5, -.2); });
     box(g, 1.7, .07, .6, m, 0, 1.25, -1.9);                             // rear wing
     [-1, 1].forEach(s => box(g, .06, .8, .6, black, s * .85, .85, -1.9));
     box(g, .3, .5, .8, m, 0, 1.0, -.7);                                 // airbox
     const h = new T.Mesh(new T.SphereGeometry(.2, 10, 10), stdMat(0xffffff, .3, 0)); h.position.set(0, 1.0, .35); g.add(h);
     box(g, .78, .08, .8, stdMat(0xffffff), 0, .82, 1.0);                // white stripe
     addWheels(g, 1.6, -1.45, 1.05, .43, .42, 0xdddddd); return g;
   }},
 { name: 'McLaren F1', year: 1993, color: 0xff7a00, max: 84, acc: 30, hnd: 1.9,
   build() {
     const g = new T.Group(), m = stdMat(0xff7a00, .25, .5);
     g.add(extrude([[-2.2,.3],[-2.2,.85],[-1,1],[.6,.95],[1.5,.7],[2.2,.55],[2.2,.3]], 1.95, m));
     g.add(extrude([[-1.2,.95],[-.7,1.42],[.3,1.42],[1.0,.9]], 1.4, glass));
     box(g, 2.0, .1, .5, black, 0, .32, 2.2);                           // splitter
     box(g, 1.7, .06, .5, black, 0, 1.12, -2.3);                        // spoiler
     [-1, 1].forEach(s => { box(g, .05, .22, .4, black, s * .8, 1.0, -2.25); box(g, .06, .1, 2.2, black, s * .98, .55, 0); });
     addWheels(g, 1.4, -1.4, .98, .38, .3, 0x222222); lights(g, 2.1, -2.2, .65, .66, .8); return g;
   }},
 { name: 'Lamborghini Countach', year: 1974, color: 0xffd400, max: 78, acc: 28, hnd: 1.8,
   build() {
     const g = new T.Group(), m = stdMat(0xffd400, .3, .4);
     g.add(extrude([[-2.2,.3],[-2.2,.95],[-.5,1.12],[2.2,.5],[2.2,.3]], 2.0, m));        // wedge
     g.add(extrude([[-.4,1.1],[.3,1.45],[1.3,.76]], 1.5, glass));
     [-1, 1].forEach(s => box(g, .06, .7, .5, black, s * .8, 1.3, -2.1));              // wing posts
     box(g, 1.9, .07, .5, m, 0, 1.65, -2.15);
     box(g, 2.05, .22, .05, black, 0, .5, -2.22);                                         // rear louvres
     addWheels(g, 1.4, -1.35, 1.02, .4, .34, 0xaaaaaa); lights(g, 2.15, -2.2, .65, .52, .85); return g;
   }},
 { name: 'Jaguar E-Type', year: 1961, color: 0x0b3d24, max: 68, acc: 23, hnd: 1.85,
   build() {
     const g = new T.Group(), m = stdMat(0x0b3d24, .25, .6);                            // British racing green
     g.add(extrude([[-2.1,.35],[-2.2,.75],[-1.4,.92],[.4,.95],[1.6,.8],[2.35,.68],[2.35,.35]], 1.7, m));
     g.add(extrude([[-1.25,.9],[-.85,1.28],[-.1,1.28],[.35,.93]], 1.35, glass));
     box(g, .55, .26, .06, chrome, 0, .6, 2.36);                                          // oval mouth
     [-1, 1].forEach(s => box(g, .04, .06, 1.6, chrome, s * .86, .5, .3));
     addWheels(g, 1.45, -1.35, .82, .36, .24, 0xd0d0d0); lights(g, 2.2, -2.2, .55, .85, .7); return g;
   }},
];

/* =====================================================================
   SCENE, LIGHTS, TRACK
   ===================================================================== */
const renderer = new T.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, matchMedia("(pointer:coarse)").matches ? 1.5 : 2));
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x9cc3e6);
scene.fog = new T.Fog(0x9cc3e6, 120, 700);
const camera = new T.PerspectiveCamera(65, 1, .5, 1500);
scene.add(new T.HemisphereLight(0xffffff, 0x4a6a3a, .85));
const sun = new T.DirectionalLight(0xfff1d0, .9); sun.position.set(200, 300, 100); scene.add(sun);

const ground = new T.Mesh(new T.PlaneGeometry(4000, 4000), new T.MeshLambertMaterial({color: 0x4fc29a}));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.05; scene.add(ground);

// Closed loop circuit from a Catmull-Rom spline through control points (x,z)
const ctrl = [[0,-300],[250,-300],[400,-150],[350,50],[150,100],[100,250],[-100,350],[-350,250],[-400,0],[-300,-200]];
const curve = new T.CatmullRomCurve3(ctrl.map(p => new T.Vector3(p[0], 0, p[1])), true, 'catmullrom', .5);
const N = 500, HALF = 8, CURB = 9.4, WALL = 11.2;
const P = [], TG = [], LF = [];            // centre points, tangents, left-normals
for (let i = 0; i < N; i++) {
  const p = curve.getPointAt(i / N), t = curve.getTangentAt(i / N); t.y = 0; t.normalize();
  P.push(p); TG.push(t); LF.push(new T.Vector3(t.z, 0, -t.x));
}
/* Flat ribbon between lateral offsets a<b (positive = left), colour per segment */
function ribbon(a, b, y, colorFn) {
  const pos = [], col = [];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N, c = new T.Color(colorFn(i));
    const v = (k, o) => [P[k].x + LF[k].x * o, y, P[k].z + LF[k].z * o];
    const A = v(i, a), B = v(i, b), C = v(j, b), D = v(j, a);
    [A, C, B, A, D, C].forEach(q => { pos.push(...q); col.push(c.r, c.g, c.b); });
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  scene.add(new T.Mesh(g, new T.MeshBasicMaterial({vertexColors: true})));
}
ribbon(-HALF, HALF, .02, i => (i >> 3) % 2 ? 0x4a5470 : 0x434d69);                 // asphalt
ribbon(-.2, .2, .04, i => i % 8 < 4 ? 0xdfe6f0 : 0x434d69);                         // dashed centre line
ribbon(HALF, CURB, .04, i => (i >> 2) % 2 ? 0xe8957f : 0xf3ead8);                   // curbs
ribbon(-CURB, -HALF, .04, i => (i >> 2) % 2 ? 0xe8957f : 0xf3ead8);

}
function startRace() {
  audio(); lvl = S.level; state = 'count'; countT = 3.99; score = 0; combo = 0; nitro = 40; padT = 0; bestLap = 1e9; stars = 0; autoN = false; touchSteer = 0;
  touchMode = matchMedia('(pointer:coarse)').matches;
  setPlace(lvl - 1); resetGems(); spawn(); mkRivals();
  $('ov').style.display = 'none'; $('hud').style.display = 'block';
  $('hint').style.display = touchMode ? 'block' : 'none'; setTimeout(() => $('hint').style.display = 'none', 6000);
}
function toMenu() {
  state = 'menu'; msg.style.display = 'none'; $('hud').style.display = 'none'; $('joy').style.display = 'none'; $('hint').style.display = 'none';
  rivals.forEach(r => scene.remove(r.root)); rivals = []; setPlace(S.level - 1); resetGems(); spawn(); render(); $('ov').style.display = 'flex';
}
$('box').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return; audio(); const a = b.dataset.a;
  if (a === 'sel') { S.sel = +b.dataset.i; save(); spawn(); render(); tone(660, .1, 'triangle'); } else if (a === 'play') startRace(); else if (a === 'menu') toMenu();
};
/* Drag anywhere to steer: the car drives itself, finger left/right = steer, drag down = brake. Full nitro fires on its own. */
const cvs = renderer.domElement; let tid = null, tx0 = 0, ty0 = 0;
const RAD = () => Math.max(60, innerWidth * .12);
cvs.addEventListener('pointerdown', e => {
  if (state !== 'race' && state !== 'count') return;
  touchMode = true; tid = e.pointerId; tx0 = e.clientX; ty0 = e.clientY; try { cvs.setPointerCapture(e.pointerId); } catch (x) {}
  $('hint').style.display = 'none'; const j = $('joy'); j.style.display = 'block'; j.style.left = tx0 + 'px'; j.style.top = ty0 + 'px'; j.firstChild.style.transform = '';
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== tid) return; const r = RAD(); let dx = e.clientX - tx0;
  if (Math.abs(dx) > r * 1.5) { tx0 = e.clientX - Math.sign(dx) * r * 1.5; dx = e.clientX - tx0; }   // anchor follows a long drag
  touchSteer = -Math.max(-1, Math.min(1, dx / r)); if (Math.abs(touchSteer) < .06) touchSteer = 0;
  touchBrake = (e.clientY - ty0) > r * 1.6; $('joy').firstChild.style.transform = `translate(${Math.max(-42, Math.min(42, dx / r * 42))}px,0)`;
});
['pointerup', 'pointercancel'].forEach(n => cvs.addEventListener(n, e => {
  if (e.pointerId !== tid) return; tid = null; touchSteer = 0; touchBrake = false; $('joy').style.display = 'none'; }));
addEventListener('keydown', e => {
  keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'ArrowUp' || e.code === 'KeyW') touchMode = false;
  if (e.code === 'KeyM') { S.mute = S.mute ? 0 : 1; save(); }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { S.sel = (S.sel + (e.code === 'ArrowLeft' ? -1 : 1) + 5) % 5; spawn(); render(); }
    if (e.code === 'Enter') startRace();
  } else if (e.code === 'Escape') toMenu(); else if (e.code === 'Enter' && state === 'done') startRace();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
$('fs').onclick = () => { try { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen).call(d); screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), orbit = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (state === 'count') { countT -= dt; if (countT <= 0) { state = 'race'; flash('🟢', 700); tone(880, .3, 'square', .05); } else flash(['🟢', '🔴', '🔴🔴', '🔴🔴🔴', '🔴🔴🔴'][Math.ceil(countT)], 0); locate(); }
  else if (state === 'race') { step(dt); updateRivals(dt); }
  else if (state === 'done') { car.vx *= .98; car.vz *= .98; car.x += car.vx * dt; car.z += car.vz * dt; car.spd = Math.hypot(car.vx, car.vz); updateRivals(dt); }
  carRoot.position.set(car.x, 0, car.z); carRoot.rotation.y = car.h;
  gems.forEach((g, k) => { g.m.rotation.y += dt * 3; g.m.position.y = 1.3 + Math.sin(now / 300 + k) * .15; });
  if (engG) engG.gain.value = S.mute || state === 'menu' ? 0 : .04, eng.frequency.value = 50 + car.spd * 2.6 + (padT > 0 ? 25 : 0);

  if (state === 'menu') {
    orbit += dt * .5; const OR = innerWidth < innerHeight ? 12 : 9.5; camera.position.set(car.x + Math.sin(orbit) * OR, 3.4, car.z + Math.cos(orbit) * OR); camera.lookAt(car.x, -.3, car.z); camera.fov = 50;
  } else {
    const vh = car.spd > 4 ? Math.atan2(car.vx, car.vz) : car.h; let d = vh - camH; d = Math.atan2(Math.sin(d), Math.cos(d)); camH += d * Math.min(1, 3 * dt);
    const asp = innerWidth / innerHeight, CD = asp < 1 ? 15 : 11, CH = asp < 1 ? 7 : 5.2;
    camera.position.lerp(new T.Vector3(car.x - Math.sin(camH) * CD, CH + car.spd * .01, car.z - Math.cos(camH) * CD), 1 - Math.exp(-6 * dt));
    camera.lookAt(car.x + Math.sin(camH) * 6.5, .4, car.z + Math.cos(camH) * 6.5);
    camera.fov += ((asp < 1 ? 72 : 62) + car.spd * .35 + (padT > 0 ? 12 : 0) - camera.fov) * Math.min(1, 4 * dt);
    const pp = progress();
    $('nbf').style.width = nitro + '%'; $('hGem').textContent = stars;
    const L = Math.min(lap, LAPS); $('hLap').textContent = '🏁'.repeat(L) + '⬜'.repeat(LAPS - L);
    $('hPos').textContent = MED[(state === 'done' ? R.pl : 1 + rivals.filter(r => r.s > pp).length) - 1];
  }
  if (state === 'race' && (boosting || drifting)) { const fx = Math.sin(car.h), fz = Math.cos(car.h);
    for (let k = 0; k < (boosting ? 3 : 1); k++) { const s = (Math.random() < .5 ? -1 : 1) * .7;
      emit(car.x - fx * 2.3 + fz * s, .5, car.z - fz * 2.3 - fx * s, (Math.random() - .5) * 4 - fx * 6, Math.random() * 3, (Math.random() - .5) * 4 - fz * 6, RB[(Math.random() * 6) | 0]); } }
  updParticles(dt);
  sky.position.copy(camera.position); camera.updateProjectionMatrix(); renderer.render(scene, camera);
}
CT = makeThumbs(); setPlace(S.level - 1); spawn(); render(); requestAnimationFrame(loop);
})();
</script>
