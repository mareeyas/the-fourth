<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1a1040">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">

<title>The Fourth</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#1a1040;color:#fff;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden}
#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:5}
#box{background:rgba(40,28,88,.92);border-radius:30px;padding:14px 16px 16px;width:100%;max-width:380px;max-height:62dvh;overflow:auto;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
h1{margin:0 0 6px;font-size:1.7rem;letter-spacing:.08em;color:#ffd23f;text-shadow:0 3px 0 #ff2fd0}
h2{margin:2px 0;font-size:1.6rem}
button{font:inherit;color:#fff;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94)}
.nm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm div{flex:1}.nm b{display:block;font-size:1.3rem}.nm small{display:block;opacity:.85;font-size:.9rem}
.ar{width:60px;height:60px;border-radius:50%;background:#7b3fe4;font-size:1.5rem;flex:none}
.sws{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff8;padding:0}.sw.on{border-color:#fff;transform:scale(1.2)}
.lv{margin:6px 0 10px;font-weight:700;opacity:.95}
.play{width:100%;height:68px;border-radius:999px;background:#2fd37a;color:#05301a;font-size:1.7rem;font-weight:900;box-shadow:0 5px 0 #1a9c58}
.row{display:flex;gap:10px;margin-top:10px}.row button{flex:1;height:54px;border-radius:999px;background:#7b3fe4;font-size:1.5rem}
.medal{font-size:84px;line-height:1.1}.sts{font-size:42px;letter-spacing:4px}
.rb{position:fixed;top:max(10px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;background:rgba(30,22,70,.75);font-size:1.4rem;z-index:6;display:none;padding:0}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="sa"></div>
<button class="rb" id="hb" style="left:10px" aria-label="Home">🏠</button>
<button class="rb" id="mb" style="right:10px" aria-label="Sound">🔊</button>
<div id="ov"><div id="box"></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),box=$('box'),ov=$('ov');
let sc=1,dpr=1,VW=360,VH=560,SAT=0;
function fit(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;sc=Math.min(innerWidth/360,innerHeight/560);VW=innerWidth/sc;VH=innerHeight/sc;SAT=$('sa').offsetHeight/sc}
addEventListener('resize',fit);fit();
/* ---------- save ---------- */
const ST={g(){try{return JSON.parse(localStorage.getItem('the_fourth_2d'))}catch(e){return null}},s(v){try{localStorage.setItem('the_fourth_2d',JSON.stringify(v))}catch(e){}}};
const S=Object.assign({level:1,stars:0,sel:0,mute:0,hint:0,cols:{}},ST.g()||{});const save=()=>ST.s(S);
/* ---------- cars (top-down, nose points up) ---------- */
const CARS=[
{n:'Toyota Supra',tag:'Turbo legend! 🔥',col:'#ff6a00',l:58,w:30,nose:.8,cab:4,cl:22,wing:1.05,wc:'#111',spd:1.05},
{n:'Mazda Miata Drifter',tag:'Slide & smoke! 💨',img:'miata.png',col:'#7a1f3d',l:62,w:28,nose:.82,cab:6,cl:18,wing:.8,wc:'#111',acc:'#fff',drift:1,spd:1.02},
{n:'Ferrari F1',tag:'Super fast! 💨',col:'#e10600',l:68,w:17,nose:.55,cab:6,cl:10,open:1,fw:1,wing:2.1,acc:'#fff',spd:1.12},
{n:'McLaren F1',tag:'Cool & speedy! 😎',col:'#7e8794',l:60,w:30,nose:.78,cab:-2,cl:24,wing:.75,acc:'#ff8c1a',spd:1.08},
{n:'Lamborghini Countach',tag:'Big wing! 🦇',col:'#ffd400',l:58,w:31,nose:.6,cab:2,cl:20,wing:1.15,wc:'#222',spd:1.05},
{n:'Jaguar E-Type',tag:'Long & smooth 🐆',col:'#0f6b3a',l:66,w:26,nose:.68,cab:8,cl:18,wing:0,spd:.98},
{n:'Mercedes 300SL',tag:'Gullwing star ⭐',col:'#dfe3e8',l:60,w:28,nose:.8,cab:2,cl:20,wing:0,acc:'#e10600',spd:1}];
const SW=['#ff3b3b','#ff8a1f','#ffd400','#35c759','#18c8d8','#3b7dff','#a45bff','#ff5fb8'];
const cc=i=>S.cols[i]||CARS[i].col;
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const IM={};
function drawCar(c,d,col,x,y,s,a){
 c.save();c.translate(x,y);c.rotate(a||0);c.scale(s,s);
 const hl=d.l/2,hw=d.w/2,nw=hw*d.nose;
 c.fillStyle='rgba(0,0,0,.25)';rr(c,-hw-2,-hl+4,d.w+4,d.l,10);c.fill();
 if(d.img){const im=IM[d.img]||(IM[d.img]=Object.assign(new Image(),{src:d.img}));if(im.complete&&im.naturalWidth){const h=d.l,w=h*im.naturalWidth/im.naturalHeight;c.drawImage(im,-w/2,-h/2,w,h);c.restore();return}}
 c.fillStyle='#14141f';const wx=d.open?hw+4:hw,ww=d.open?11:8,wl=d.open?20:15;
 [[-1,-.6],[1,-.6],[-1,.58],[1,.58]].forEach(p=>{rr(c,p[0]*wx-ww/2,p[1]*hl-wl/2,ww,wl,3);c.fill()});
 if(d.fw){c.fillStyle='#222';rr(c,-hw*1.9,-hl-2,hw*3.8,6,2);c.fill()}
 c.fillStyle=col;c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,-hl);c.quadraticCurveTo(nw,-hl,nw,-hl+10);c.lineTo(hw,-hl*.3);c.lineTo(hw,hl-10);c.quadraticCurveTo(hw,hl,hw-6,hl);c.lineTo(-hw+6,hl);c.quadraticCurveTo(-hw,hl,-hw,hl-10);c.lineTo(-hw,-hl*.3);c.lineTo(-nw,-hl+10);c.quadraticCurveTo(-nw,-hl,0,-hl);c.closePath();c.fill();c.stroke();
 if(d.acc){c.fillStyle=d.acc;c.fillRect(-hw*.28,-hl+3,hw*.2,d.l-8);c.fillRect(hw*.08,-hl+3,hw*.2,d.l-8)}
 if(d.open){c.fillStyle='#111';rr(c,-3,d.cab-9,6,18,2);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(0,d.cab,4.2,0,7);c.fill()}
 else{c.fillStyle='#1d2a40';rr(c,-hw*.66,d.cab-d.cl/2,hw*1.32,d.cl,6);c.fill();c.fillStyle=col;rr(c,-hw*.5,d.cab-d.cl*.26,hw,d.cl*.5,4);c.fill();c.fillStyle='rgba(255,255,255,.28)';c.fill()}
 c.fillStyle='#fff7b0';[-1,1].forEach(k=>{c.beginPath();c.arc(k*nw*.6,-hl+7,2.8,0,7);c.fill()});
 c.fillStyle='#ff2b2b';c.fillRect(-hw+4,hl-3,7,3);c.fillRect(hw-11,hl-3,7,3);
 if(d.wing){const w2=hw*d.wing;c.fillStyle=d.wc||'#222';rr(c,-w2,hl-9,w2*2,7,2);c.fill();c.fillRect(-w2-1,hl-12,2.5,13);c.fillRect(w2-1.5,hl-12,2.5,13)}
 c.restore()}
/* ---------- places ---------- */
const PL=[
{n:'Sunny Meadow',g1:'#7ed957',g2:'#72cf4f',road:'#5d6785',sc:['🌳','🌼','🌷','🐑','🌲']},
{n:'Candy Land',g1:'#ffb3d9',g2:'#ffa3cf',road:'#8a6fa8',sc:['🍭','🍬','🧁','🍩','🍦']},
{n:'Snowy Hills',g1:'#f2f8ff',g2:'#e1ecfa',road:'#7b86a8',sc:['⛄','🌲','❄️','🎄']},
{n:'Sandy Desert',g1:'#f6d98a',g2:'#efcf78',road:'#6d6a7a',sc:['🌵','🐪','🌴','🪨']},
{n:'Beach Bay',g1:'#ffe9a8',g2:'#fbe09a',road:'#5d7a99',sc:['🌴','⛱️','🦀','🐚','🐬']},
{n:'Night City',g1:'#3b3f7a',g2:'#343870',road:'#2f3352',sc:['🏢','🏬','🌆','🌙','⭐']}];
/* ---------- state ---------- */
let st='menu',lvl=S.level,played=1,D=0,v=0,px=0,tx=180,L=5000,items=[],rivals=[],tot=0,got=0,ct=0,ft=0,T=0,boostT=0,slowT=0,spinT=0,shake=0,bonkCD=0,chain=0,chainT=0,place=1,bigT=0,bigS='',parts=[],txts=[];
const keys={},py=()=>VH*.74,pl=()=>PL[(lvl-1)%PL.length],RW=()=>lvl>=5?96:105;
const rc=d=>VW/2+(Math.sin(d/430)*52+Math.sin(d/173+1)*18)*Math.min(1,.25+lvl*.12)*Math.min(1,Math.max(d,0)/500);
const hs=(i,s)=>{const x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)};
const clamp=(a,b,c)=>a<b?b:a>c?c:a;
/* ---------- audio ---------- */
let AC,eo,eg;
function unlock(){if(AC){if(AC.resume)AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();eo=AC.createOscillator();eo.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;eg=AC.createGain();eg.gain.value=0;eo.connect(f);f.connect(eg);eg.connect(AC.destination);eo.start()}catch(e){AC=null}}
function tone(f,d,ty,vol){if(!AC||S.mute)return;const o=AC.createOscillator(),n=AC.createGain();o.type=ty||'sine';o.frequency.value=f;n.gain.setValueAtTime(vol||.1,AC.currentTime);n.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
/* ---------- level ---------- */
function mk(n){
 lvl=n;played=n;L=4800+Math.min(n,10)*450;const r=(()=>{let a=n*7919+13;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}})();
 items=[];const R=RW()-22,pc=Math.min(.3,.1+n*.03);let d=450;
 while(d<L-350){const q=r();
  if(q<.5){const b=(r()-.5)*1.2*R;for(let i=0;i<5;i++)items.push({t:'s',d:d+i*34,lx:clamp(b+Math.sin(i*.9)*26,-R,R)});d+=170+60+r()*80}
  else if(q<.5+pc){const k=r()<.4?2:1,a=(r()-.5)*2*R;items.push({t:'c',d,lx:a});if(k>1)items.push({t:'c',d:d+10,lx:clamp(a+(a>0?-80:80),-R,R)});d+=150}
  else{items.push({t:'p',d,lx:(r()-.5)*2*R*.8});d+=160}}
 for(let b=800;b<L-500;b+=1100)items.push({t:'b',d:b,lx:(r()-.5)*R});
 tot=items.filter(i=>i.t==='s').length;got=0;
 rivals=[0,1,2].map(i=>{let k=(S.sel+1+i+n)%CARS.length;if(k===S.sel)k=(k+1)%CARS.length;return{d:40+i*38,lx:(i-1)*55,tl:(i-1)*55,tt:1+i,def:CARS[k],col:CARS[k].col,sp:Math.min(.99,.84+i*.03+n*.008),ah:true}});
 D=0;v=0;px=0;tx=VW/2;boostT=slowT=spinT=shake=0;parts=[];txts=[];ct=3.6;st='count';ft=0;bigS='';
}
function start(n){unlock();ov.style.display='none';$('hb').style.display=$('mb').style.display='block';$('mb').textContent=S.mute?'🔇':'🔊';mk(n)}
function pos(){return 1+rivals.filter(r=>r.d>D).length}
function say(s,x,y,c){txts.push({s,x,y,l:1,c:c||'#fff'})}
function burst(x,y,col,n,k){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:(Math.random()-.8)*140,l:1,c:col,k:k||'o'})}
/* ---------- menus ---------- */
function menu(){
 st='menu';lvl=S.level;ov.style.display='flex';$('hb').style.display=$('mb').style.display='none';D=0;v=0;
 const c=CARS[S.sel],sws=c.img?'':SW.map(x=>`<button class="sw${S.cols[S.sel]===x?' on':''}" data-c="${x}" style="background:${x}" aria-label="Paint ${x}"></button>`).join('')+`<button class="sw${S.cols[S.sel]?'':' on'}" data-c="" style="background:#fff;color:#333" aria-label="Original colour">↺</button>`;
 box.innerHTML=`<h1>THE FOURTH</h1><div class="nm"><button class="ar" id="pv" aria-label="Previous car">◀</button><div><b>${c.n}</b><small>${c.tag}</small></div><button class="ar" id="nx" aria-label="Next car">▶</button></div><div class="sws">${sws}</div><p class="lv">Level ${lvl} · ${pl().n} · ⭐ ${S.stars}</p><button class="play" id="go">▶ PLAY</button>`;
 $('pv').onclick=()=>{S.sel=(S.sel+CARS.length-1)%CARS.length;save();menu()};$('nx').onclick=()=>{S.sel=(S.sel+1)%CARS.length;save();menu()};
 box.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{if(b.dataset.c)S.cols[S.sel]=b.dataset.c;else delete S.cols[S.sel];save();menu()});
 $('go').onclick=()=>start(lvl)}
function result(){
 st='res';const ratio=tot?got/tot:1,n=ratio>=.9?3:ratio>=.6?2:1;S.stars+=got;S.level=Math.max(S.level,played+1);S.hint=1;save();
 const M=['🥇','🥈','🥉','🏅'],T2=['You won!','Super job!','Great job!','Nice try! Go again!'];
 ov.style.display='flex';$('hb').style.display=$('mb').style.display='none';
 box.innerHTML=`<div class="medal">${M[Math.min(place,4)-1]}</div><h2>${T2[Math.min(place,4)-1]}</h2><div class="sts">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><p class="lv">You got ${got} of ${tot} stars!</p><button class="play" id="go">▶ NEXT LEVEL</button><div class="row"><button id="ag" aria-label="Play again">🔁</button><button id="hm" aria-label="Home">🏠</button></div>`;
 $('go').onclick=()=>start(S.level);$('ag').onclick=()=>start(played);$('hm').onclick=menu}
$('hb').onclick=menu;$('mb').onclick=()=>{S.mute=S.mute?0:1;$('mb').textContent=S.mute?'🔇':'🔊';save()};
/* ---------- input ---------- */
const tp=e=>{tx=e.clientX/sc;if(AC&&AC.state==='suspended')AC.resume()};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);tp(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tp(e)});
addEventListener('keydown',e=>{keys[e.code]=1});addEventListener('keyup',e=>{keys[e.code]=0});
/* ---------- update ---------- */
function step(dt){
 T+=dt;shake=Math.max(0,shake-dt*40);bonkCD-=dt;chainT-=dt;if(chainT<0)chain=0;
 if(st==='menu'||st==='res'&&0){D+=110*dt}
 if(st==='count'){ct-=dt;const n=Math.ceil(ct-.6);if(ct<=.6&&bigS!=='GO!'){bigS='GO!';bigT=1;tone(880,.4,'square',.07);st='race'}else if(n>0&&String(n)!==bigS){bigS=String(n);bigT=1;tone(440,.15,'square',.06)}}
 if(st==='race'||st==='fin'){
  const fin=st==='fin',base=250*(1+Math.min(lvl,12)*.025),vm=base*CARS[S.sel].spd*(boostT>0?1.55:1)*(slowT>0?.55:1)*(spinT>0?.7:1);
  v+=((fin?70:vm)-v)*Math.min(1,dt*1.8);D+=v*dt;
  if(keys.ArrowLeft||keys.KeyA)tx-=330*dt;if(keys.ArrowRight||keys.KeyD)tx+=330*dt;tx=clamp(tx,0,VW);
  const lim=RW()-15,want=fin?0:tx-rc(D);px+=clamp(want-px,-340*dt,340*dt);
  if(Math.abs(px)>lim){px=clamp(px,-lim,lim);v*=1-.3*dt}
  boostT-=dt;slowT-=dt;spinT-=dt;
  if(CARS[S.sel].drift&&!fin&&v>80&&Math.abs(tx-rc(D)-px)>25)for(let i=0;i<2;i++)parts.push({x:rc(D)+px+(i?11:-11)+(Math.random()-.5)*6,y:py()+24,vx:(Math.random()-.5)*30,vy:25,l:.6,c:'rgba(235,235,245,.75)',k:'s'});
  const cx=rc(D)+px;
  if(boostT>0)for(let i=0;i<2;i++)parts.push({x:cx+(Math.random()-.5)*14,y:py()+34,vx:(Math.random()-.5)*20,vy:60,l:.7,c:'hsl('+(T*500+i*60)%360+',90%,60%)',k:'o'});
  items.forEach(it=>{
   if(it.gone)return;
   if(it.fl!==undefined){it.fl-=dt*1.6;if(it.fl<=0)it.gone=1;return}
   if(it.mag){it.d+=(D-it.d)*Math.min(1,dt*9);it.lx+=(px-it.lx)*Math.min(1,dt*9);if(Math.abs(it.d-D)<10){it.gone=1;got++;chain++;chainT=1;tone(660+Math.min(chain,8)*60,.14,'sine',.12);burst(cx,py(),'#ffe14d',6);if(chain>=5&&chain%5===0)say('Wow! '+chain,cx,py()-40,'#ffe14d')}return}
   const dd=it.d-D;if(Math.abs(dd)>90)return;const ax=Math.abs(rc(it.d)+it.lx-cx);
   if(it.t==='s'){if(ax<48)it.mag=1}
   else if(Math.abs(dd)<26){
    if(it.t==='c'&&ax<24){it.fl=1;it.fd=rc(it.d)+it.lx<cx?-1:1;slowT=.7;shake=10;v*=.6;say('Oops!',cx,py()-40,'#ffb347');tone(150,.2,'square',.1)}
    else if(it.t==='p'&&ax<30&&spinT<=0){spinT=.9;slowT=.5;say('Wheee!',cx,py()-40,'#8fd8ff');tone(300,.3,'triangle',.1)}
    else if(it.t==='b'&&ax<34&&boostT<=0){boostT=1.8;say('Boost!',cx,py()-40,'#ff7bd9');tone(520,.35,'sawtooth',.07);burst(cx,py(),'#fff',12)}}
  });
  rivals.forEach(r=>{
   const rv=base*r.sp*(r.d-D>350?.85:D-r.d>250?1.08:1);r.d+=rv*dt;r.tt-=dt;if(r.tt<0){r.tt=2+Math.random()*2;r.tl=(Math.random()-.5)*2*(RW()-30)}r.lx+=(r.tl-r.lx)*dt*1.5;
   const rx=rc(r.d)+r.lx,dd=r.d-D;
   if(Math.abs(dd)<46&&Math.abs(rx-cx)<30){const sg=cx<rx?-1:1;px+=sg*140*dt;r.lx-=sg*60*dt;v*=1-.8*dt;if(bonkCD<=0){bonkCD=.6;tone(200,.1,'square',.07);shake=4}}
   if(r.ah&&D>r.d+34){r.ah=false;say('Passed!',cx,py()-50,'#9dffb0');tone(784,.12,'triangle',.1)}else if(!r.ah&&r.d>D+34)r.ah=true});
  if(!fin&&D>=L){st='fin';ft=2.4;place=pos();bigS=['1st!','2nd!','3rd!','4th!'][place-1];bigT=1.6;tone(523,.2,'triangle',.12);setTimeout(()=>tone(659,.2,'triangle',.12),160);setTimeout(()=>tone(784,.4,'triangle',.12),320);for(let i=0;i<80;i++)parts.push({x:Math.random()*VW,y:-10-Math.random()*200,vx:(Math.random()-.5)*40,vy:80+Math.random()*160,l:3,c:'hsl('+Math.random()*360+',90%,60%)',k:'c'})}
  if(fin){ft-=dt;if(ft<=0)result()}
 }
 if(eg&&AC)eg.gain.value=(st==='race'||st==='fin')&&!S.mute?.03:0,eo.frequency.value=70+v*.45;
 parts=parts.filter(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='o')p.vy+=200*dt;return p.l>0});
 txts=txts.filter(t=>{t.l-=dt*1.1;t.y-=40*dt;return t.l>0});bigT-=dt}
/* ---------- draw ---------- */
const FNT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Trebuchet MS",sans-serif';
function txt(s,x,y,sz,col){g.font='900 '+sz+'px '+FNT;g.textAlign='center';g.textBaseline='middle';g.lineWidth=sz/6;g.strokeStyle='rgba(40,20,90,.85)';g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function emo(s,x,y,sz){g.font=sz+'px '+FNT;g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function pill(s,x,y,al){g.font='bold 20px '+FNT;const w=g.measureText(s).width+24,x0=al==='r'?x-w:x;g.fillStyle='rgba(30,22,70,.72)';rr(g,x0,y,w,34,17);g.fill();g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';g.fillText(s,x0+12,y+18)}
function draw(){
 g.setTransform(dpr*sc,0,0,dpr*sc,0,0);const p=pl(),rw=RW(),P=py();
 g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 for(let y=-6;y<VH+8;y+=4){const d=D+(P-y),cx=rc(d);
  g.fillStyle=Math.floor(d/80)%2?p.g1:p.g2;g.fillRect(-10,y,VW+20,5);
  g.fillStyle=Math.floor(d/24)%2?'#ff5a5a':'#fff';g.fillRect(cx-rw-9,y,rw*2+18,5);
  g.fillStyle=p.road;g.fillRect(cx-rw,y,rw*2,5);
  if(Math.floor(d/50)%2&&d>0)g.fillStyle='#fff',g.fillRect(cx-2,y,4,5);
  if(d>=L&&d<L+40){const q=Math.floor((d-L)/10);for(let k=0;k*20<rw*2;k++){g.fillStyle=(k+q)%2?'#fff':'#111';g.fillRect(cx-rw+k*20,y,20,5)}}}
 /* scenery */
 const i0=Math.max(0,Math.floor((D-100)/70)),i1=Math.floor((D+VH+100)/70);
 for(let i=i0;i<=i1;i++){const d=i*70+hs(i,9)*30,y=P-(d-D);for(let s=-1;s<=1;s+=2)for(let k=0;k<3;k++){const off=rw+32+k*90+hs(i,s+k*3)*50;if(off>VW/2+30)continue;const h=hs(i+k*7,s);emo(p.sc[Math.floor(h*p.sc.length)],rc(d)+s*off,y,26+h*16)}}
 /* finish gate */
 {const y=P-(L-D);if(y>-60&&y<VH+60){const cx=rc(L);g.fillStyle='#fff';g.fillRect(cx-rw-14,y-70,10,70);g.fillRect(cx+rw+4,y-70,10,70);['#f66','#fa4','#fe5','#6d8','#6bf','#b8f'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(cx-rw-14,y-72+i*5,rw*2+28,5)});txt('🏁 FINISH 🏁',cx,y-92,20)}}
 /* items */
 items.forEach(it=>{if(it.gone)return;const y=P-(it.d-D);if(y<-50||y>VH+50)return;const x=rc(it.d)+it.lx;
  if(it.t==='s'){const b=1+Math.sin(T*6+it.d)*.12;emo('⭐',x,y,30*b)}
  else if(it.t==='p'){g.fillStyle='rgba(110,198,255,.9)';g.beginPath();g.ellipse(x,y,28,17,0,0,7);g.fill();g.strokeStyle='#d6f1ff';g.lineWidth=3;g.beginPath();g.ellipse(x,y,18,10,0,0,7);g.stroke()}
  else if(it.t==='b'){g.fillStyle='rgba(30,20,70,.55)';rr(g,x-30,y-24,60,52,12);g.fill();g.lineWidth=7;g.lineCap='round';['#ff6b6b','#ffd23f','#6bdc8b','#6bb8ff'].forEach((c,i)=>{g.strokeStyle=c;g.beginPath();g.moveTo(x-20,y+16-i*11+6);g.lineTo(x,y+2-i*11+6);g.lineTo(x+20,y+16-i*11+6);g.stroke()})}
  else{const f=it.fl===undefined?1:it.fl,o=1-f;g.save();g.translate(x+(it.fd||0)*o*70,y-o*90);g.rotate(o*9);g.scale(f,f);g.fillStyle='#ff7a1a';g.beginPath();g.moveTo(0,-17);g.lineTo(13,12);g.lineTo(-13,12);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(-7,-2,14,5);g.fillStyle='#e85d04';g.fillRect(-16,11,32,5);g.restore()}});
 /* cars */
 rivals.forEach(r=>{const y=P-(r.d-D);if(y>-60&&y<VH+60)drawCar(g,r.def,r.col,rc(r.d)+r.lx,y,1,0)});
 if(st==='menu'){drawCar(g,CARS[S.sel],cc(S.sel),VW/2,Math.min(VH*.3,230),2.5,Math.sin(T*1.5)*.12)}
 else{const cx=rc(D)+px,K=CARS[S.sel].drift?2.5:1,lean=st==='race'||st==='fin'?clamp((tx-cx)*.006*K,-.28*K,.28*K):0,sp=spinT>0?(1-spinT/.9)*6.283:0;
  if(boostT>0){['#ff6b6b','#ffd23f','#6bdc8b','#6bb8ff'].forEach((c,i)=>{g.fillStyle=c;g.globalAlpha=.8;rr(g,cx-12+i*6,P+30,5,30+Math.random()*14,3);g.fill()});g.globalAlpha=1}
  drawCar(g,CARS[S.sel],cc(S.sel),cx,P,1,lean+sp)}
 /* particles / text */
 parts.forEach(q=>{g.globalAlpha=Math.min(1,q.l);g.fillStyle=q.c;if(q.k==='c')g.fillRect(q.x,q.y,6,9);else{g.beginPath();g.arc(q.x,q.y,3.5,0,7);g.fill()}});g.globalAlpha=1;
 txts.forEach(t=>{g.globalAlpha=Math.min(1,t.l*1.5);txt(t.s,t.x,t.y,26,t.c)});g.globalAlpha=1;
 g.restore();
 /* HUD */
 if(st==='count'||st==='race'||st==='fin'){const top=10+SAT;pill((['🥇','🥈','🥉','4️⃣'])[Math.min(pos(),4)-1]+' '+pos()+'/4',VW/2-6,top,'r');pill('⭐ '+got,VW/2+6,top);
  const bw=200,bx=VW/2-bw/2,by=top+52;g.fillStyle='rgba(30,22,70,.6)';rr(g,bx,by,bw,12,6);g.fill();g.fillStyle='#ffd23f';rr(g,bx,by,Math.max(12,bw*Math.min(1,D/L)),12,6);g.fill();emo('🏁',bx+bw+14,by+7,22);emo('🏎️',bx+bw*Math.min(1,D/L),by+6,24)}
 if(bigT>0&&bigS)txt(bigS,VW/2,VH*.38,Math.min(150,70+bigT*50),'#ffe14d');
 if(!S.hint&&lvl===1&&(st==='count'||st==='race'&&D<1200)){txt('Slide your finger to steer!',VW/2,VH*.58,22);emo('👆',VW/2+Math.sin(T*3)*70,VH*.66,48)}}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
