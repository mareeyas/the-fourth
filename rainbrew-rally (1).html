<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1040">
<title>Rainbrew Rally</title>
<style>
:root{--card:rgba(44,26,78,.92);--ink:#ffe8fb;--soft:rgba(255,232,251,.14);--btn:#7b3fe4;--btn2:#8a6cf0;--ok:#2fbf71;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1a1040;color:var(--ink);overscroll-behavior:none;
  font-family:"Segoe UI","Trebuchet MS",system-ui,-apple-system,Roboto,Arial,sans-serif}
canvas{display:block;position:fixed;inset:0;touch-action:none}
h1{margin:4px 0;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:.06em;text-transform:uppercase;font-weight:900;line-height:1.1}
p{margin:4px 0}.meta{font-size:.85rem;opacity:.8}.big{font-size:1.3rem;font-weight:800}
.gem{display:inline-block;width:.75em;height:.75em;background:linear-gradient(135deg,#b6f6ff,#2bb8ff);transform:rotate(45deg);border-radius:2px;margin:0 .45em 0 .2em}
button{font:inherit;font-weight:800;color:#fff;border:0;border-radius:999px;background:var(--btn);padding:12px 30px;cursor:pointer;
  box-shadow:0 4px 14px rgba(150,80,200,.4);text-transform:uppercase;letter-spacing:.04em}
button:active{transform:scale(.96)}button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.sec{background:transparent;border:2px solid var(--btn2);box-shadow:none}
/* ---- garage / results overlay ---- */
#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5;
  background:linear-gradient(transparent 30%,rgba(26,16,64,.7))}
#box{background:var(--card);border-radius:28px;padding:16px 18px 14px;width:100%;max-width:880px;max-height:94vh;max-height:94dvh;overflow:auto;
  text-align:center;box-shadow:0 10px 40px rgba(120,60,180,.45);backdrop-filter:blur(6px)}
.gp{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 16px;font-weight:800;margin:6px 0}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin:8px 0}
.card{position:relative;text-align:left;text-transform:none;letter-spacing:0;font-weight:600;padding:10px 10px 8px;border-radius:18px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);box-shadow:none}
.card.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.card b{display:block;font-size:.95rem;line-height:1.1;max-width:78%;font-weight:800}.card small{opacity:.75;font-size:.75rem}
.sw{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:3px solid #fff}
.bar{display:flex;align-items:center;gap:5px;font-size:.68rem;margin-top:4px;opacity:.9}.bar span{width:52px}
.bar div{flex:1;height:5px;background:rgba(255,255,255,.18);border-radius:3px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.pr{display:block;margin-top:6px;font-style:normal;font-weight:800;font-size:.85rem;color:var(--gold)}
.ups{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
.ups button{padding:8px 14px;font-size:.8rem;background:rgba(255,255,255,.12);box-shadow:none}
.ups small{opacity:.8;font-weight:600;margin:0 4px}
#go,.go{background:var(--ok);color:#06240f;font-size:1.25rem;padding:14px 44px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stat{display:flex;justify-content:space-around;margin:10px 0}.stat div{font-size:.78rem;opacity:.9}.stat b{display:block;font-size:1.4rem}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:4;padding:max(12px,env(safe-area-inset-top)) 14px 14px}
.pill{display:inline-block;background:rgba(44,26,78,.82);border-radius:999px;padding:6px 16px;font-weight:800;backdrop-filter:blur(4px)}
#hud .tl{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px}
#hud .tr{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;text-align:right}
#hud .tc{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center}
#hud .bc{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;min-width:240px}
#kmh{font-size:clamp(54px,10vw,92px);font-weight:900;line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.bc small{color:var(--gold);font-weight:800;margin-left:6px}
#nb{height:12px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px;border:2px solid rgba(255,255,255,.35)}
#nb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b3b,#ffe14d,#3ddc84,#3da5ff,#9b5cff)}
.lbl{font-size:.7rem;opacity:.8;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.boss{background:#c0152a;color:#fff;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:900;margin-left:6px}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;pointer-events:none;font-size:clamp(70px,22vw,200px);
  font-weight:900;text-shadow:0 6px 30px rgba(0,0,0,.6);color:#fff}
#help{position:fixed;bottom:14px;right:16px;font-size:.75rem;opacity:.7;z-index:4;display:none;text-align:right}
/* ---- touch pad ---- */
#pad{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 14px 14px;z-index:7;pointer-events:none}
#pad div{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#pad b{width:68px;height:68px;border-radius:50%;background:rgba(44,26,78,.7);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;
  font-size:26px;user-select:none;touch-action:none}#pad b.on{background:var(--btn)}
@media (max-width:640px){#hud .bc{bottom:92px}#help{display:none!important}}
</style>
</head>
<body>
<div id="ov"><div id="box"></div></div>
<div id="hud">
  <div class="tl"><span class="pill" id="hLv"></span><div class="lbl" style="margin:6px 0 0 8px" id="hCar"></div></div>
  <div class="tc"><span class="pill" id="hScore">0</span> <span class="pill" id="hMul" style="color:var(--gold)">x1</span></div>
  <div class="tr"><span class="pill"><i class="gem"></i><span id="hGem">0</span></span>
    <div class="pill" style="margin-top:6px">Lap <span id="hLap">1/3</span> · P<span id="hPos">1</span>/4</div>
    <div class="lbl" style="margin-top:6px">Lap time <span id="hTime" style="font-size:1rem">0:00.00</span></div></div>
  <div class="bc"><div><span id="kmh">0</span><small>km/h</small></div><div id="nb"><i></i></div><div class="lbl" style="margin-top:4px">Rainbrew nitro · Shift</div></div>
</div>
<div id="msg"></div>
<div id="help">W/↑ gas · S/↓ brake · A/D steer · Space drift · Shift nitro · M mute · Esc garage</div>
<div id="pad"><div><b data-k="ArrowLeft">◀</b><b data-k="ArrowRight">▶</b></div><div><b data-k="ShiftLeft">⚡</b><b data-k="ArrowDown">▼</b><b data-k="ArrowUp">▲</b></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE, $ = id => document.getElementById(id);
/* =====================================================================
   CAR BUILDERS
   Side profiles are [z,y] points (z+ = front) extruded across the width.
   ===================================================================== */
function extrude(profile, width, mat) {
  const s = new T.Shape();
  profile.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
  const g = new T.ExtrudeGeometry(s, {depth: width - .16, bevelEnabled: true, bevelSize: .08, bevelThickness: .08, bevelSegments: 2});
  g.translate(0, 0, -(width - .16) / 2);
  const m = new T.Mesh(g, mat);
  m.rotation.y = -Math.PI / 2;           // local x -> world z (car forward)
  return m;
}
const stdMat = (c, r = .35, m = .5) => new T.MeshStandardMaterial({color: c, roughness: r, metalness: m});
const glass = new T.MeshStandardMaterial({color: 0x1a2630, roughness: .1, metalness: .8});
const black = stdMat(0x111111, .6, .2), chrome = stdMat(0xdddddd, .15, 1);
const lightF = new T.MeshBasicMaterial({color: 0xfff3c0}), lightR = new T.MeshBasicMaterial({color: 0xff2020});

function box(g, w, h, l, mat, x, y, z) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, l), mat); m.position.set(x, y, z); g.add(m); return m;
}
/* Wheel = pivot (steer) > spin (roll) > cylinder. Returns pivots for animation. */
function addWheels(g, fz, rz, tx, r, w, rimColor) {
  const wheels = [];
  [[tx, fz, 1], [-tx, fz, 1], [tx, rz, 0], [-tx, rz, 0]].forEach(([x, z, front]) => {
    const pivot = new T.Group(), spin = new T.Group();
    const tire = new T.Mesh(new T.CylinderGeometry(r, r, w, 20), stdMat(0x181818, .9, 0));
    tire.rotation.z = Math.PI / 2;
    const rim = new T.Mesh(new T.CylinderGeometry(r * .62, r * .62, w + .02, 10), stdMat(rimColor, .3, .9));
    rim.rotation.z = Math.PI / 2;
    const spoke = new T.Mesh(new T.BoxGeometry(w + .04, r * .2, r * 1.2), black);   // makes rotation visible
    spin.add(tire, rim, spoke); pivot.add(spin); pivot.position.set(x, r, z); g.add(pivot);
    wheels.push({pivot, spin, front});
  });
  g.userData.wheels = wheels;
}
function lights(g, front, rear, w, yF, yR) {
  [-1, 1].forEach(s => {
    const a = new T.Mesh(new T.SphereGeometry(.13, 8, 8), lightF); a.position.set(s * w, yF, front); g.add(a);
    box(g, .3, .08, .05, lightR, s * w, yR, rear);
  });
}

const CARS = [
 { name: 'Mercedes-Benz 300SL', year: 1954, color: 0xc9ced4, max: 70, acc: 24, hnd: 1.75,
   build() {
     const g = new T.Group(), m = stdMat(0xc9ced4, .25, .9);
     g.add(extrude([[-2.1,.35],[-2.2,.75],[-1.4,.92],[.2,1],[1.5,.88],[2.2,.7],[2.2,.35]], 1.85, m));
     g.add(extrude([[-1.0,.95],[-.6,1.4],[.35,1.4],[.8,.98]], 1.5, glass));
     // gullwing doors raised slightly on the roofline
     [-1, 1].forEach(s => { const d = box(g, .05, .5, 1.1, m, s * .78, 1.12, -.1); d.rotation.z = -s * .35; });
     box(g, .7, .22, .06, chrome, 0, .62, 2.25);                 // grille
     addWheels(g, 1.35, -1.35, .9, .37, .26, 0xcccccc); lights(g, 2.15, -2.2, .6, .78, .75); return g;
   }},
 { name: 'Ferrari F1 (Classic)', year: 1976, color: 0xd40000, max: 92, acc: 34, hnd: 2.1,
   build() {
     const g = new T.Group(), m = stdMat(0xd40000, .3, .4);
     box(g, .75, .5, 3.2, m, 0, .55, -.1);                               // tub
     const nose = new T.Mesh(new T.CylinderGeometry(.12, .36, 1.6, 12), m);
     nose.rotation.x = Math.PI / 2; nose.position.set(0, .5, 2.2); g.add(nose);
     box(g, 2.0, .06, .5, m, 0, .25, 2.9);                               // front wing
     [-1, 1].forEach(s => { box(g, .06, .3, .5, black, s * 1.0, .38, 2.9); box(g, .5, .45, 1.5, m, s * .62, .5, -.2); });
     box(g, 1.7, .07, .6, m, 0, 1.25, -1.9);                             // rear wing
     [-1, 1].forEach(s => box(g, .06, .8, .6, black, s * .85, .85, -1.9));
     box(g, .3, .5, .8, m, 0, 1.0, -.7);                                 // airbox
     const h = new T.Mesh(new T.SphereGeometry(.2, 10, 10), stdMat(0xffffff, .3, 0)); h.position.set(0, 1.0, .35); g.add(h);
     box(g, .78, .08, .8, stdMat(0xffffff), 0, .82, 1.0);                // white stripe
     addWheels(g, 1.6, -1.45, 1.05, .43, .42, 0xdddddd); return g;
   }},
 { name: 'McLaren F1', year: 1993, color: 0xff7a00, max: 84, acc: 30, hnd: 1.9,
   build() {
     const g = new T.Group(), m = stdMat(0xff7a00, .25, .5);
     g.add(extrude([[-2.2,.3],[-2.2,.85],[-1,1],[.6,.95],[1.5,.7],[2.2,.55],[2.2,.3]], 1.95, m));
     g.add(extrude([[-1.2,.95],[-.7,1.42],[.3,1.42],[1.0,.9]], 1.4, glass));
     box(g, 2.0, .1, .5, black, 0, .32, 2.2);                           // splitter
     box(g, 1.7, .06, .5, black, 0, 1.12, -2.3);                        // spoiler
     [-1, 1].forEach(s => { box(g, .05, .22, .4, black, s * .8, 1.0, -2.25); box(g, .06, .1, 2.2, black, s * .98, .55, 0); });
     addWheels(g, 1.4, -1.4, .98, .38, .3, 0x222222); lights(g, 2.1, -2.2, .65, .66, .8); return g;
   }},
 { name: 'Lamborghini Countach', year: 1974, color: 0xffd400, max: 78, acc: 28, hnd: 1.8,
   build() {
     const g = new T.Group(), m = stdMat(0xffd400, .3, .4);
     g.add(extrude([[-2.2,.3],[-2.2,.95],[-.5,1.12],[2.2,.5],[2.2,.3]], 2.0, m));        // wedge
     g.add(extrude([[-.4,1.1],[.3,1.45],[1.3,.76]], 1.5, glass));
     [-1, 1].forEach(s => box(g, .06, .7, .5, black, s * .8, 1.3, -2.1));              // wing posts
     box(g, 1.9, .07, .5, m, 0, 1.65, -2.15);
     box(g, 2.05, .22, .05, black, 0, .5, -2.22);                                         // rear louvres
     addWheels(g, 1.4, -1.35, 1.02, .4, .34, 0xaaaaaa); lights(g, 2.15, -2.2, .65, .52, .85); return g;
   }},
 { name: 'Jaguar E-Type', year: 1961, color: 0x0b3d24, max: 68, acc: 23, hnd: 1.85,
   build() {
     const g = new T.Group(), m = stdMat(0x0b3d24, .25, .6);                            // British racing green
     g.add(extrude([[-2.1,.35],[-2.2,.75],[-1.4,.92],[.4,.95],[1.6,.8],[2.35,.68],[2.35,.35]], 1.7, m));
     g.add(extrude([[-1.25,.9],[-.85,1.28],[-.1,1.28],[.35,.93]], 1.35, glass));
     box(g, .55, .26, .06, chrome, 0, .6, 2.36);                                          // oval mouth
     [-1, 1].forEach(s => box(g, .04, .06, 1.6, chrome, s * .86, .5, .3));
     addWheels(g, 1.45, -1.35, .82, .36, .24, 0xd0d0d0); lights(g, 2.2, -2.2, .55, .85, .7); return g;
   }},
];

/* =====================================================================
   SCENE, LIGHTS, TRACK
   ===================================================================== */
const renderer = new T.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x9cc3e6);
scene.fog = new T.Fog(0x9cc3e6, 120, 700);
const camera = new T.PerspectiveCamera(65, 1, .5, 1500);
scene.add(new T.HemisphereLight(0xffffff, 0x4a6a3a, .85));
const sun = new T.DirectionalLight(0xfff1d0, .9); sun.position.set(200, 300, 100); scene.add(sun);

const ground = new T.Mesh(new T.PlaneGeometry(4000, 4000), new T.MeshLambertMaterial({color: 0x4fc29a}));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.05; scene.add(ground);

// Closed loop circuit from a Catmull-Rom spline through control points (x,z)
const ctrl = [[0,-300],[250,-300],[400,-150],[350,50],[150,100],[100,250],[-100,350],[-350,250],[-400,0],[-300,-200]];
const curve = new T.CatmullRomCurve3(ctrl.map(p => new T.Vector3(p[0], 0, p[1])), true, 'catmullrom', .5);
const N = 500, HALF = 8, CURB = 9.4, WALL = 11.2;
const P = [], TG = [], LF = [];            // centre points, tangents, left-normals
for (let i = 0; i < N; i++) {
  const p = curve.getPointAt(i / N), t = curve.getTangentAt(i / N); t.y = 0; t.normalize();
  P.push(p); TG.push(t); LF.push(new T.Vector3(t.z, 0, -t.x));
}
/* Flat ribbon between lateral offsets a<b (positive = left), colour per segment */
function ribbon(a, b, y, colorFn) {
  const pos = [], col = [];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N, c = new T.Color(colorFn(i));
    const v = (k, o) => [P[k].x + LF[k].x * o, y, P[k].z + LF[k].z * o];
    const A = v(i, a), B = v(i, b), C = v(j, b), D = v(j, a);
    [A, C, B, A, D, C].forEach(q => { pos.push(...q); col.push(c.r, c.g, c.b); });
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  scene.add(new T.Mesh(g, new T.MeshLambertMaterial({vertexColors: true})));
}
ribbon(-HALF, HALF, .02, i => (i >> 3) % 2 ? 0x3b3f46 : 0x353941);                 // asphalt
ribbon(-.2, .2, .04, i => i % 8 < 4 ? 0xffffff : 0x353941);                         // dashed centre line
ribbon(HALF, CURB, .04, i => (i >> 2) % 2 ? 0xd62828 : 0xffffff);                   // curbs
ribbon(-CURB, -HALF, .04, i => (i >> 2) % 2 ? 0xd62828 : 0xffffff);
ribbon(CURB, CURB + 6, .01, () => 0x72d9b0); ribbon(-CURB - 6, -CURB, .01, () => 0x72d9b0);

// Barriers: instanced blocks along both edges
const bar = new T.InstancedMesh(new T.BoxGeometry(1, 1.1, 4.7), new T.MeshLambertMaterial(), N * 2);
const M4 = new T.Matrix4(), Q = new T.Quaternion(), Y = new T.Vector3(0, 1, 0), ONE = new T.Vector3(1, 1, 1);
for (let i = 0; i < N; i++) [-1, 1].forEach((s, k) => {
  const idx = i * 2 + k, h = Math.atan2(TG[i].x, TG[i].z);
  M4.compose(new T.Vector3(P[i].x + LF[i].x * WALL * s, .55, P[i].z + LF[i].z * WALL * s), Q.setFromAxisAngle(Y, h), ONE);
  bar.setMatrixAt(idx, M4); bar.setColorAt(idx, new T.Color((i >> 1) % 2 ? 0xe8e8e8 : 0x7b3fe4));
});
scene.add(bar);

// Start / finish: checker strip + gantry
const cv = document.createElement('canvas'); cv.width = 128; cv.height = 32;
const cx = cv.getContext('2d');
for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) { cx.fillStyle = (x + y) % 2 ? '#fff' : '#111'; cx.fillRect(x * 8, y * 8, 8, 8); }
const line = new T.Mesh(new T.PlaneGeometry(HALF * 2, 3), new T.MeshBasicMaterial({map: new T.CanvasTexture(cv)}));
line.rotation.x = -Math.PI / 2; line.position.set(P[0].x, .06, P[0].z); line.rotation.z = Math.atan2(TG[0].x, TG[0].z) + Math.PI / 2 * 0; 
line.rotation.order = 'YXZ'; line.rotation.set(-Math.PI / 2, 0, 0); line.rotation.y = 0;
line.quaternion.setFromEuler(new T.Euler(-Math.PI / 2, 0, 0, 'XYZ'));
line.quaternion.premultiply(new T.Quaternion().setFromAxisAngle(Y, Math.atan2(TG[0].x, TG[0].z)));
scene.add(line);
const gantry = new T.Group(), gm = stdMat(0xf5c400, .5, .3);
[-1, 1].forEach(s => { const pst = new T.Mesh(new T.BoxGeometry(.8, 9, .8), gm); pst.position.set(s * (WALL + .8), 4.5, 0); gantry.add(pst); });
const beam = new T.Mesh(new T.BoxGeometry((WALL + .8) * 2 + .8, 1.6, .9), gm); beam.position.y = 9; gantry.add(beam);
gantry.position.copy(P[0]); gantry.rotation.y = Math.atan2(TG[0].x, TG[0].z); scene.add(gantry);

// Trees scattered away from the track
{
  const cone = new T.InstancedMesh(new T.ConeGeometry(3, 9, 7), new T.MeshLambertMaterial({color: 0xc77dff}), 160);
  const trunk = new T.InstancedMesh(new T.CylinderGeometry(.5, .6, 3, 6), new T.MeshLambertMaterial({color: 0x5a3d22}), 160);
  let n = 0, tries = 0;
  while (n < 160 && tries++ < 3000) {
    const x = (Math.random() - .5) * 1300, z = (Math.random() - .5) * 1100; let ok = true;
    for (let i = 0; i < N; i += 4) if ((P[i].x - x) ** 2 + (P[i].z - z) ** 2 < 900) { ok = false; break; }
    if (!ok) continue;
    const s = .8 + Math.random() * .8;
    M4.compose(new T.Vector3(x, 4.5 * s + 1.5, z), Q.identity(), new T.Vector3(s, s, s)); cone.setMatrixAt(n, M4);
    M4.compose(new T.Vector3(x, 1.5 * s, z), Q.identity(), new T.Vector3(s, s, s)); trunk.setMatrixAt(n++, M4);
  }
  cone.count = trunk.count = n; scene.add(cone, trunk);
}


/* =====================================================================
   RAINBREW RALLY GAME LAYER
   ===================================================================== */
const LAPS = 3, DS = curve.getLength() / N;                       // DS = metres per track sample
CARS.forEach((c, i) => c.price = [300, 3500, 1800, 900, 0][i]);  // Mercedes, Ferrari, McLaren, Countach, Jaguar (starter)
const UN = ['Engine', 'Grip', 'Nitro'], UC = [120, 260, 450, 750, 1200];
const GEM = '<i class="gem"></i>';

/* ---- save data (localStorage with safe fallback) ---- */
const ST = {g() { try { return JSON.parse(localStorage.getItem('rainbrew_rally')); } catch (e) { return null; } },
            s(v) { try { localStorage.setItem('rainbrew_rally', JSON.stringify(v)); } catch (e) {} }};
const S = Object.assign({gems: 0, owned: [4], up: [0, 0, 0], level: 1, best: 0, mute: 0, sel: 4}, ST.g() || {});
const save = () => ST.s(S);
const eff = c => ({max: c.max * (1 + .04 * S.up[0]), acc: c.acc * (1 + .05 * S.up[0]),
                   hnd: c.hnd * (1 + .04 * S.up[1]), grip: 6.5 + .45 * S.up[1]});

/* ---- dusk sky dome + four "places" (palette changes every level) ---- */
const sky = new T.Mesh(new T.SphereGeometry(1000, 16, 12), new T.MeshBasicMaterial({vertexColors: true, side: T.BackSide, fog: false, depthWrite: false}));
scene.add(sky);
const PLACES = [
  {n: 'Sunset Bay',    top: 0x3b1d8f, mid: 0xb66ae8, hor: 0xffb3a0, gr: 0x4fc29a},
  {n: 'Neon Dusk',     top: 0x120a3a, mid: 0x7b2fd0, hor: 0xff5fb7, gr: 0x2a8f8a},
  {n: 'Candy Morning', top: 0x5aa8ff, mid: 0xbfe0ff, hor: 0xffd9ec, gr: 0x7ad9a0},
  {n: 'Moonlit Mesa',  top: 0x0a0f2c, mid: 0x2b3a8f, hor: 0x7fa0ff, gr: 0x3a6a8f}];
function setPlace(i) {
  const p = PLACES[i % 4], pos = sky.geometry.attributes.position, col = [];
  const a = new T.Color(p.top), b = new T.Color(p.mid), h = new T.Color(p.hor), c = new T.Color();
  for (let k = 0; k < pos.count; k++) {
    const t = pos.getY(k) / 1000;
    if (t < .05) c.copy(h); else if (t < .45) c.copy(h).lerp(b, (t - .05) / .4); else c.copy(b).lerp(a, Math.min(1, (t - .45) / .5));
    col.push(c.r, c.g, c.b);
  }
  sky.geometry.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  scene.fog.color.copy(h); scene.fog.near = 150; scene.fog.far = 750; ground.material.color.set(p.gr);
}
// Rainbow arch over the start line (brand nod)
['#ff3b3b', '#ff9f1c', '#ffe14d', '#3ddc84', '#3da5ff', '#9b5cff'].forEach((c, i) =>
  gantry.add(new T.Mesh(new T.TorusGeometry(15 + i * .9, .45, 6, 40, Math.PI), new T.MeshBasicMaterial({color: c}))));

/* ---- rainbow boost pads ---- */
const PADS = [60, 185, 300, 430];
const pc = document.createElement('canvas'); pc.width = pc.height = 64;
{ const x = pc.getContext('2d'), g = x.createLinearGradient(0, 0, 64, 0);
  ['#ff3b3b', '#ffe14d', '#3ddc84', '#3da5ff', '#9b5cff'].forEach((c, i, a) => g.addColorStop(i / (a.length - 1), c));
  x.fillStyle = '#1a1040'; x.fillRect(0, 0, 64, 64); x.strokeStyle = g; x.lineWidth = 9;
  [8, 34].forEach(y => { x.beginPath(); x.moveTo(4, y); x.lineTo(32, y + 22); x.lineTo(60, y); x.stroke(); }); }   // V points down = forward
const padTex = new T.CanvasTexture(pc);
function lay(mesh, i, off, y) {                                   // put a flat object on the track, facing along it
  mesh.position.set(P[i].x + LF[i].x * off, y, P[i].z + LF[i].z * off);
  mesh.quaternion.setFromEuler(new T.Euler(-Math.PI / 2, 0, 0)).premultiply(new T.Quaternion().setFromAxisAngle(Y, Math.atan2(TG[i].x, TG[i].z)));
}
const padMeshes = PADS.map(i => { const m = new T.Mesh(new T.PlaneGeometry(7, 9), new T.MeshBasicMaterial({map: padTex})); lay(m, i, 0, .07); scene.add(m); return m; });

/* ---- gems on the road: groups of 5 that swing between lanes ---- */
const gemGeo = new T.OctahedronGeometry(.7), gemMat = new T.MeshStandardMaterial({color: 0x39e0ff, emissive: 0x1590c0, roughness: .2, metalness: .5});
const gems = [];
for (let i = 8; i < N - 8; i += 3) {
  const g = Math.floor(i / 21); if (i % 21 >= 15 || PADS.some(p => Math.abs(p - i) < 8)) continue;
  const m = new T.Mesh(gemGeo, gemMat); m.scale.y = 1.5; m.position.set(P[i].x + LF[i].x * ((g * 2) % 3 - 1) * 4.2, 1.3, P[i].z + LF[i].z * ((g * 2) % 3 - 1) * 4.2);
  scene.add(m); gems.push({m, on: true});
}
const resetGems = () => gems.forEach(g => { g.on = true; g.m.visible = true; });

/* ---- audio (tiny WebAudio: engine drone + chimes) ---- */
let AC, eng, engG;
function audio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); eng = AC.createOscillator(); eng.type = 'sawtooth';
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; engG = AC.createGain(); engG.gain.value = 0;
    eng.connect(f); f.connect(engG); engG.connect(AC.destination); eng.start(); } catch (e) { AC = null; }
}
function tone(f, d = .12, type = 'sine', v = .08) {
  if (!AC || S.mute) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
}

/* ---- state ---- */
const keys = {}, msg = $('msg');
let state = 'menu', carRoot, model, sp = eff(CARS[S.sel]), car, idx = 0, lap = 1, started = false, passedHalf = false;
let lapT = 0, countT = 0, camH = 0, steerVis = 0, lat = 0, lvl = 1, score = 0, combo = 0, nitro = 0, padT = 0, padCD = 0, rivals = [], R = null;
const fmt = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(2).padStart(5, '0');
const mult = () => Math.min(3, 1 + Math.floor(combo / 6));
const addNitro = n => nitro = Math.min(100, nitro + n * (1 + .25 * S.up[2]));
function flash(t, ms) { msg.textContent = t; msg.style.display = 'flex'; if (ms) setTimeout(() => { if (msg.textContent === t) msg.style.display = 'none'; }, ms); }

function spawn() {                                                 // (re)build the player's car on the grid
  if (carRoot) scene.remove(carRoot);
  const c = CARS[S.sel]; sp = eff(c); model = c.build(); carRoot = new T.Group(); carRoot.add(model); scene.add(carRoot);
  const i0 = N - 6, h = Math.atan2(TG[i0].x, TG[i0].z);
  car = {x: P[i0].x, z: P[i0].z, h, vx: 0, vz: 0, spd: 0}; idx = i0; lap = 1; started = false; passedHalf = false; lapT = 0; camH = h; lat = 0;
}
function mkRivals() {                                              // three AI cars; every 5th level one is a glowing BOSS
  rivals.forEach(r => scene.remove(r.root)); rivals = [];
  const boss = lvl % 5 === 0, base = 42 + 3.5 * (lvl - 1);
  for (let k = 0; k < 3; k++) {
    const isB = boss && k === 0, m = CARS[(lvl + k) % 5].build(), root = new T.Group(); root.add(m);
    if (isB) { root.scale.setScalar(1.15); m.traverse(o => { if (o.material) { o.material = o.material.clone(); if (o.material.emissive) o.material.emissive.set(0x7a0010); } }); }
    scene.add(root);
    rivals.push({root, m, s: -(9 + k * 4), v: Math.min(90, base * (.9 + .06 * k) * (isB ? 1.15 : 1)), lane: k % 2 ? 3.2 : -3.2, ph: k * 2, boss: isB, fin: false, vv: 0});
  }
}
function progress() { return (lap - 1) * N + (started ? idx : idx - N); }

function locate() {                                                // nearest centre-line sample near last index
  let bi = idx, bd = 1e12;
  for (let k = -25; k <= 25; k++) { const i = (idx + k + N) % N, d = (P[i].x - car.x) ** 2 + (P[i].z - car.z) ** 2; if (d < bd) { bd = d; bi = i; } }
  const prev = idx; idx = bi; lat = (car.x - P[idx].x) * LF[idx].x + (car.z - P[idx].z) * LF[idx].z; return prev;
}

function step(dt) {
  const K = keys, up = K.ArrowUp || K.KeyW, dn = K.ArrowDown || K.KeyS, lt = K.ArrowLeft || K.KeyA, rt = K.ArrowRight || K.KeyD, hb = K.Space;
  const nit = (K.ShiftLeft || K.ShiftRight || K.KeyE) && nitro > 0; if (nit) nitro = Math.max(0, nitro - 34 * dt); if (padT > 0) padT -= dt;
  const bo = nit || padT > 0, onG = Math.abs(lat) > CURB, max = sp.max * (onG ? .55 : 1) * (bo ? 1.28 : 1), acc = sp.acc * (bo ? 1.8 : 1);
  const fx = Math.sin(car.h), fz = Math.cos(car.h), lx = fz, lz = -fx;
  let vf = car.vx * fx + car.vz * fz, vl = car.vx * lx + car.vz * lz;

  if (up || bo) vf += acc * (1 - Math.max(vf, 0) / max) * dt * (vf < 0 ? 2.5 : 1);
  if (dn) vf -= (vf > 1 ? 60 : sp.acc * .8 * (1 + vf / (max * .35))) * dt;
  if (!up && !dn && !bo) vf -= vf * .35 * dt;
  if (onG) vf -= vf * 1.3 * dt;
  vf = Math.max(vf, -max * .35); if (vf > max) vf -= (vf - max) * 2 * dt;

  const sIn = (lt ? 1 : 0) - (rt ? 1 : 0);
  car.h += sIn * sp.hnd * Math.min(Math.abs(vf) / 8, 1) * (1 - .4 * Math.abs(vf) / sp.max) * dt * (vf >= 0 ? 1 : -1);
  steerVis += (sIn * .45 - steerVis) * Math.min(1, 10 * dt);
  if (Math.abs(vl) > 4 && car.spd > 20) addNitro(16 * dt);        // drifting charges the nitro
  vl *= Math.exp(-(hb ? 1.6 : sp.grip) * dt); if (hb) vf -= vf * .25 * dt;
  const nfx = Math.sin(car.h), nfz = Math.cos(car.h);
  car.vx = nfx * vf + nfz * vl; car.vz = nfz * vf - nfx * vl; car.x += car.vx * dt; car.z += car.vz * dt;

  const prev = locate();
  if (Math.abs(lat) > WALL - 1) {                                  // barrier: push back, bleed speed, break the combo
    const s = Math.sign(lat), over = Math.abs(lat) - (WALL - 1);
    car.x -= LF[idx].x * over * s; car.z -= LF[idx].z * over * s;
    const vn = car.vx * LF[idx].x * s + car.vz * LF[idx].z * s;
    if (vn > 0) { if (vn > 6) { combo = 0; tone(110, .2, 'square'); } car.vx -= LF[idx].x * s * vn * 1.4; car.vz -= LF[idx].z * s * vn * 1.4; car.vx *= .9; car.vz *= .9; }
  }
  rivals.forEach(r => { const dx = car.x - r.root.position.x, dz = car.z - r.root.position.z, d = Math.hypot(dx, dz);   // bump AI cars
    if (d < 3 && d > .01) { car.x += dx / d * (3 - d) * .6; car.z += dz / d * (3 - d) * .6; car.vx *= .985; car.vz *= .985; } });
  car.spd = Math.hypot(car.vx, car.vz);

  gems.forEach(g => { if (!g.on) return; const dx = g.m.position.x - car.x, dz = g.m.position.z - car.z;
    if (dx * dx + dz * dz < 5) { g.on = false; g.m.visible = false; combo++; score += 10 * mult(); S.gems++; addNitro(3); tone(660 + Math.min(combo, 20) * 30, .1, 'triangle'); } });
  padCD -= dt;
  PADS.forEach(i => { const dx = P[i].x - car.x, dz = P[i].z - car.z; if (padCD <= 0 && dx * dx + dz * dz < 40) { padT = 1.8; padCD = 2; addNitro(10); tone(300, .35, 'sawtooth', .06); flash('BOOST!', 500); } });

  if (idx > N * .4 && idx < N * .6) passedHalf = true;             // lap logic: far side must be visited first
  if (prev > N * .8 && idx < N * .2) {
    if (!started) started = true;
    else if (passedHalf) { passedHalf = false; if (lap >= LAPS) { finish(); return; } lap++; lapT = 0; resetGems(); flash('LAP ' + lap, 900); tone(520, .3, 'triangle'); }
  }
  lapT += dt;
  model.rotation.z += (Math.max(-.08, Math.min(.08, -vl * .01)) - model.rotation.z) * Math.min(1, 8 * dt);
  model.userData.wheels.forEach(w => { w.spin.rotation.x += vf * dt / .4; if (w.front) w.pivot.rotation.y = steerVis; });
}

function updateRivals(dt) {
  const t = performance.now() / 1000;
  rivals.forEach(r => {
    r.vv += (r.v - r.vv) * Math.min(1, .8 * dt); r.s += r.vv * dt / DS; if (!r.fin && r.s >= LAPS * N) r.fin = true;
    const fl = Math.floor(r.s), i = ((fl % N) + N) % N, j = (i + 1) % N, f = r.s - fl, ln = r.lane + 2 * Math.sin(t * .4 + r.ph);
    r.root.position.set(P[i].x + (P[j].x - P[i].x) * f + LF[i].x * ln, 0, P[i].z + (P[j].z - P[i].z) * f + LF[i].z * ln);
    r.root.rotation.y = Math.atan2(TG[i].x, TG[i].z);
    r.m.userData.wheels.forEach(w => w.spin.rotation.x += r.vv * dt / .4);
  });
}

/* =====================================================================
   MENUS & FLOW
   ===================================================================== */
const statBar = (l, v) => `<div class="bar"><span>${l}</span><div><i style="width:${Math.min(100, v) | 0}%"></i></div></div>`;
function render() {
  const c = CARS[S.sel], own = S.owned.includes(S.sel), boss = S.level % 5 === 0;
  $('box').innerHTML = `<h1>Rainbrew Rally</h1><p class="meta">${PLACES[(S.level - 1) % 4].n} · Level ${S.level}${boss ? ' · BOSS RACE' : ''} · Best score ${S.best}</p>
  <div class="gp">${GEM}${S.gems}</div>
  <div class="cars">${CARS.map((k, i) => `<button class="card${i === S.sel ? ' on' : ''}" data-a="sel" data-i="${i}"><span class="sw" style="background:#${k.color.toString(16).padStart(6, '0')}"></span><b>${k.name}</b><small>${k.year}</small>${statBar('Speed', k.max / .95)}${statBar('Accel', k.acc / .36)}${statBar('Handling', k.hnd / .0225)}<em class="pr">${S.owned.includes(i) ? 'Owned' : GEM + k.price}</em></button>`).join('')}</div>
  <div class="ups">${S.up.map((l, i) => `<button data-a="up" data-i="${i}" ${l >= 5 || S.gems < UC[l] ? 'disabled' : ''}>${UN[i]}<small>Lv ${l}</small>${l >= 5 ? 'MAX' : GEM + UC[l]}</button>`).join('')}</div>
  ${own ? `<button class="go" data-a="play">Race level ${S.level}</button>` : `<button class="go" data-a="buy" ${S.gems < c.price ? 'disabled' : ''}>Unlock ${GEM}${c.price}</button>`}
  <p class="meta" style="margin-top:8px">Win with 1st–2nd place (1st on boss races). Collect gems, hit rainbow pads, drift to charge nitro.</p>`;
}
function showResults() {
  $('hud').style.display = 'none'; $('pad').style.display = 'none'; $('help').style.display = 'none'; msg.style.display = 'none';
  $('box').innerHTML = `<h1>${R.win ? 'You win!' : 'Not quite'}</h1><p class="big">Place ${R.pl} of 4</p>
  <div class="stat"><div><b>${score}</b>Score</div><div><b>+${R.bonus}</b>Finish gems</div><div><b>${fmtBest()}</b>Best lap</div></div>
  <div class="row"><button class="go" data-a="play">${R.win ? 'Next level ' + S.level : 'Retry level ' + lvl}</button><button class="sec" data-a="menu">Garage</button></div>`;
  $('ov').style.display = 'flex';
}
let bestLap = 1e9; const fmtBest = () => bestLap < 1e9 ? fmt(bestLap) : '--';
function finish() {
  state = 'done'; bestLap = Math.min(bestLap, lapT);
  const pl = 1 + rivals.filter(r => r.fin).length, win = pl <= (lvl % 5 === 0 ? 1 : 2), bonus = [90, 55, 30, 12][pl - 1] + lvl * 5;
  S.gems += bonus; if (win && lvl >= S.level) S.level = lvl + 1; S.best = Math.max(S.best, score); save();
  R = {pl, win, bonus}; tone(win ? 880 : 220, .5, 'triangle'); setTimeout(showResults, 900); flash(win ? 'FINISH!' : 'FINISH', 0);
}
function startRace() {
  audio(); lvl = S.level; state = 'count'; countT = 3.99; score = 0; combo = 0; nitro = 25; padT = 0; bestLap = 1e9;
  setPlace(lvl - 1); resetGems(); spawn(); mkRivals();
  $('ov').style.display = 'none'; $('hud').style.display = 'block'; $('help').style.display = 'block';
  if (matchMedia('(pointer:coarse)').matches) $('pad').style.display = 'flex';
  $('hLv').innerHTML = `Level ${lvl}` + (lvl % 5 === 0 ? '<span class="boss">BOSS</span>' : ''); $('hCar').textContent = CARS[S.sel].name + ' · ' + PLACES[(lvl - 1) % 4].n;
}
function toMenu() {
  state = 'menu'; msg.style.display = 'none'; $('hud').style.display = 'none'; $('pad').style.display = 'none'; $('help').style.display = 'none';
  rivals.forEach(r => scene.remove(r.root)); rivals = []; setPlace(S.level - 1); resetGems(); spawn(); render(); $('ov').style.display = 'flex';
}
$('box').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return; audio(); const a = b.dataset.a, i = +b.dataset.i;
  if (a === 'sel') { S.sel = i; save(); spawn(); render(); }
  else if (a === 'buy') { const p = CARS[S.sel].price; if (S.gems >= p) { S.gems -= p; S.owned.push(S.sel); save(); tone(880, .3); render(); } }
  else if (a === 'up') { const l = S.up[i]; if (l < 5 && S.gems >= UC[l]) { S.gems -= UC[l]; S.up[i]++; save(); tone(990, .2); render(); } }
  else if (a === 'play') startRace(); else if (a === 'menu') toMenu();
};
addEventListener('keydown', e => {
  keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') { S.mute = S.mute ? 0 : 1; save(); }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { S.sel = (S.sel + (e.code === 'ArrowLeft' ? -1 : 1) + 5) % 5; spawn(); render(); }
    if (e.code === 'Enter' && S.owned.includes(S.sel)) { audio(); startRace(); }
  } else if (e.code === 'Escape') toMenu(); else if (e.code === 'Enter' && state === 'done') startRace();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad b').forEach(b => {                 // touch controls
  const on = v => e => { e.preventDefault(); keys[b.dataset.k] = v; b.classList.toggle('on', v); };
  ['pointerdown'].forEach(n => b.addEventListener(n, on(true))); ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, on(false)));
});
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), orbit = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (state === 'count') { countT -= dt; if (countT <= 0) { state = 'race'; flash('GO!', 700); tone(880, .3, 'square', .05); } else flash(String(Math.ceil(countT)), 0); locate(); }
  else if (state === 'race') { step(dt); updateRivals(dt); }
  else if (state === 'done') { car.vx *= .98; car.vz *= .98; car.x += car.vx * dt; car.z += car.vz * dt; car.spd = Math.hypot(car.vx, car.vz); updateRivals(dt); }
  carRoot.position.set(car.x, 0, car.z); carRoot.rotation.y = car.h;
  gems.forEach((g, k) => { g.m.rotation.y += dt * 3; g.m.position.y = 1.3 + Math.sin(now / 300 + k) * .15; });
  if (engG) engG.gain.value = S.mute || state === 'menu' ? 0 : .04, eng.frequency.value = 50 + car.spd * 2.6 + (padT > 0 ? 25 : 0);

  if (state === 'menu') {
    orbit += dt * .5; camera.position.set(car.x + Math.sin(orbit) * 8, 2.8, car.z + Math.cos(orbit) * 8); camera.lookAt(car.x, 1, car.z); camera.fov = 50;
  } else {
    const vh = car.spd > 4 ? Math.atan2(car.vx, car.vz) : car.h; let d = vh - camH; d = Math.atan2(Math.sin(d), Math.cos(d)); camH += d * Math.min(1, 3 * dt);
    camera.position.lerp(new T.Vector3(car.x - Math.sin(camH) * 9.5, 4.4 + car.spd * .01, car.z - Math.cos(camH) * 9.5), 1 - Math.exp(-6 * dt));
    camera.lookAt(car.x + Math.sin(camH) * 5, 1.4, car.z + Math.cos(camH) * 5);
    camera.fov += (62 + car.spd * .35 + (padT > 0 ? 12 : 0) - camera.fov) * Math.min(1, 4 * dt);
    const pp = progress();
    $('kmh').textContent = Math.round(car.spd * 3.6); $('nb').firstChild.style.width = nitro + '%'; $('hScore').textContent = score; $('hMul').textContent = 'x' + mult();
    $('hGem').textContent = S.gems; $('hLap').textContent = Math.min(lap, LAPS) + '/' + LAPS; $('hTime').textContent = fmt(lapT);
    $('hPos').textContent = state === 'done' ? R.pl : 1 + rivals.filter(r => r.s > pp).length;
  }
  sky.position.copy(camera.position); camera.updateProjectionMatrix(); renderer.render(scene, camera);
}
setPlace(S.level - 1); spawn(); render(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
